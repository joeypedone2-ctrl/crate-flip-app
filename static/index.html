<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Crate Flip</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Crate Flip</h1>
    <div class="header-right">
      <div id="stats">loading…</div>
      <button id="browse-toggle-btn" class="folder-toggle-btn" title="Browse library" aria-label="Browse library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
        </svg>
      </button>
      <button id="folder-toggle-btn" class="folder-toggle-btn" title="Add music folder" aria-label="Add music folder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="folder-panel" class="folder-panel" hidden>
    <div class="folder-row">
      <input id="folder-input" type="text" placeholder="/path/to/your/music" autocomplete="off" />
      <button id="browse-btn" class="folder-btn" hidden>Browse…</button>
      <button id="scan-btn" class="folder-btn folder-btn-primary">Scan</button>
      <button id="cancel-scan-btn" class="folder-btn folder-btn-danger" hidden>Cancel</button>
    </div>
    <div class="folder-row-secondary">
      <div id="folder-status" class="folder-status"></div>
      <button id="remove-folder-btn" class="folder-link-btn">Remove this folder from library</button>
    </div>
  </div>

  <div id="browse-area" class="browse-area" hidden>
    <div class="browse-controls">
      <input id="browse-search" type="text" placeholder="Search filename or genre…" autocomplete="off" />
    </div>
    <div class="browse-table-wrap">
      <table class="browse-table">
        <colgroup>
          <col style="width: auto;" />
          <col style="width: 150px;" />
          <col style="width: 90px;" />
          <col style="width: 115px;" />
          <col style="width: 115px;" />
          <col style="width: 95px;" />
          <col style="width: 150px;" />
        </colgroup>
        <thead>
          <tr>
            <th data-sort="filename">
              <span class="th-label">Filename</span>
              <button type="button" class="col-filter-btn" data-col="filename" aria-label="Filter Filename" title="Filter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>
              </button>
            </th>
            <th data-sort="genre">
              <span class="th-label">Genre</span>
              <button type="button" class="col-filter-btn" data-col="genre" aria-label="Filter Genre" title="Filter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>
              </button>
            </th>
            <th data-sort="energy">
              <span class="th-label">Energy</span>
              <button type="button" class="col-filter-btn" data-col="energy" aria-label="Filter Energy" title="Filter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>
              </button>
            </th>
            <th data-sort="status">
              <span class="th-label">Status</span>
              <button type="button" class="col-filter-btn" data-col="status" aria-label="Filter Status" title="Filter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>
              </button>
            </th>
            <th data-sort="modified">
              <span class="th-label">Modified</span>
              <button type="button" class="col-filter-btn" data-col="modified" aria-label="Filter Modified" title="Filter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>
              </button>
            </th>
            <th data-sort="duration">
              <span class="th-label">Duration</span>
              <button type="button" class="col-filter-btn" data-col="duration" aria-label="Filter Duration" title="Filter">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>
              </button>
            </th>
            <th></th>
          </tr>
        </thead>
        <tbody id="browse-tbody"></tbody>
      </table>
    </div>
    <div id="browse-empty" class="browse-empty" hidden>No tracks match.</div>
  </div>

  <div id="col-filter-popover" class="col-filter-popover" hidden></div>

  <main id="review-area">
    <div id="card" class="card">
      <div id="filename" class="filename"></div>

      <div class="player">
        <audio id="player" preload="metadata"></audio>
        <button id="play-btn" class="play-btn" aria-label="Play/Pause">
          <svg id="play-icon" class="icon-visible" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pause-icon" class="icon-hidden" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <div class="player-track">
          <div class="player-bar" id="player-bar">
            <div class="player-progress" id="player-progress"></div>
          </div>
          <div class="player-time">
            <span id="time-current">0:00</span>
            <span id="time-duration">0:00</span>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="genre-input">Genre</label>
        <input id="genre-input" list="genre-options" autocomplete="off" />
        <datalist id="genre-options">
          <option value="house"></option>
          <option value="tech house"></option>
          <option value="deep house"></option>
          <option value="techno"></option>
          <option value="melodic techno"></option>
          <option value="hard techno"></option>
          <option value="trance"></option>
          <option value="progressive trance"></option>
          <option value="dubstep"></option>
          <option value="drum and bass"></option>
          <option value="garage"></option>
          <option value="breaks"></option>
          <option value="minimal"></option>
        </datalist>
      </div>

      <div class="field">
        <label>Energy</label>
        <div class="star-rating" id="energy-stars" role="radiogroup" aria-label="Energy rating">
          <button type="button" class="star" data-value="1" aria-label="1 star">
            <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.5 4.8 1.7 7.1L12 17.3 5.8 21.4l1.7-7.1L2 9.5l7.1-.6z"/></svg>
          </button>
          <button type="button" class="star" data-value="2" aria-label="2 stars">
            <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.5 4.8 1.7 7.1L12 17.3 5.8 21.4l1.7-7.1L2 9.5l7.1-.6z"/></svg>
          </button>
          <button type="button" class="star" data-value="3" aria-label="3 stars">
            <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.5 4.8 1.7 7.1L12 17.3 5.8 21.4l1.7-7.1L2 9.5l7.1-.6z"/></svg>
          </button>
          <button type="button" class="star" data-value="4" aria-label="4 stars">
            <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.5 4.8 1.7 7.1L12 17.3 5.8 21.4l1.7-7.1L2 9.5l7.1-.6z"/></svg>
          </button>
          <button type="button" class="star" data-value="5" aria-label="5 stars">
            <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.9 7.1.6-5.5 4.8 1.7 7.1L12 17.3 5.8 21.4l1.7-7.1L2 9.5l7.1-.6z"/></svg>
          </button>
        </div>
      </div>

      <button id="revert-btn" class="revert-btn" title="Revert to prediction" aria-label="Revert to prediction" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
        </svg>
        <span>Revert</span>
      </button>
    </div>

    <div id="empty-state" class="empty-state" hidden>
      <p>No pending tracks left to review.</p>
    </div>

    <div id="actions" class="actions">
      <button id="delete-btn" class="icon-btn icon-btn-delete" title="Delete (X)" aria-label="Delete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/>
          <path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/>
          <path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/>
        </svg>
      </button>
      <div class="nav-btns">
        <button id="back-btn" class="icon-btn icon-btn-nav" title="Back (↑)" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"/><path d="M6 11l6-6 6 6"/>
          </svg>
        </button>
        <button id="skip-btn" class="icon-btn icon-btn-nav" title="Skip (↓)" aria-label="Skip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14"/><path d="M18 13l-6 6-6-6"/>
          </svg>
        </button>
      </div>
      <button id="confirm-btn" class="icon-btn icon-btn-confirm" title="Confirm (C)" aria-label="Confirm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 13l4 4L19 7"/>
        </svg>
      </button>
    </div>

    <p class="hint">↑ back · ↓ skip · C confirm · X delete · ← / → seek 10s · space play/pause</p>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
